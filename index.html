<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Client Risk Score Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#101828',
          slate: { 50: '#F7F8FA', 100: '#F0F1F3', 200: '#E4E7EC', 400: '#98A2B3', 500: '#667085', 700: '#344054' },
          cobalt: '#2450C4',
          riskgreen: { DEFAULT: '#12805C', bg: '#ECFDF5', border: '#A6E9D2' },
          riskamber: { DEFAULT: '#B54708', bg: '#FFFAEB', border: '#FBD9A6' },
          riskred: { DEFAULT: '#B42318', bg: '#FEF3F2', border: '#F6B8B2' },
        },
        fontFamily: {
          serif: ['"Source Serif 4"', 'serif'],
          sans: ['Inter', 'sans-serif'],
          mono: ['"IBM Plex Mono"', 'monospace'],
        },
      }
    }
  }
</script>
<style>
  body { background-color: #F7F8FA; }
  .tick { stroke: #CBD2DD; stroke-width: 1.5; }
  .num-tab { font-variant-numeric: tabular-nums; }
  .hairline { box-shadow: inset 0 0 0 1px #E4E7EC; }
</style>
</head>
<body class="min-h-screen text-ink font-sans antialiased">

  <!-- Top ledger bar -->
  <header class="bg-ink text-white">
    <div class="max-w-6xl mx-auto px-5 sm:px-8 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="h-8 w-8 rounded-sm border border-white/25 flex items-center justify-center font-serif text-sm">RA</div>
        <div class="leading-tight">
          <p class="text-sm font-semibold tracking-wide">Risk Assessment Ledger</p>
          <p class="text-[11px] text-white/50 font-mono">Counterparty Credit &amp; Operations Review</p>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-5 sm:px-8 py-8 sm:py-10">

    <!-- NEW: Dynamic Search Bar -->
    <div class="mb-10 bg-white p-4 rounded-lg hairline flex gap-4 items-center">
      <input type="text" id="companyName" placeholder="Enter company name to analyze..." class="border border-slate-200 p-3 rounded-md w-full font-sans text-sm outline-none focus:border-cobalt transition-colors">
      <button id="analyzeBtn" onclick="runMockAI()" class="bg-cobalt hover:bg-blue-800 transition-colors text-white px-6 py-3 rounded-md text-sm font-semibold whitespace-nowrap">
        Run AI Analysis
      </button>
    </div>

    <!-- Client meta strip -->
    <div class="flex flex-wrap items-end justify-between gap-4 mb-6 pb-6 border-b border-slate-200">
      <div>
        <p class="text-[11px] uppercase tracking-[0.14em] text-slate-500 font-semibold mb-1">Client Record</p>
        <!-- I added an ID here so JS can change the name -->
        <h1 id="clientNameDisplay" class="font-serif text-2xl sm:text-3xl font-semibold text-ink">Meridian Textiles Ltd.</h1>
        <p class="text-sm text-slate-500 mt-1">Apparel Manufacturing &amp; Export · Client ID CRM-88291 · Onboarded Mar 2021</p>
      </div>
    </div>

    <!-- (The rest of your dashboard remains visually unchanged here) -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- Score / Gauge card -->
      <section class="lg:col-span-4">
        <div class="bg-white rounded-lg hairline p-6 h-full flex flex-col">
          <p class="text-[11px] uppercase tracking-[0.14em] text-slate-500 font-semibold mb-4">Composite Risk Score</p>

          <div class="relative mx-auto w-full max-w-[260px]">
            <svg viewBox="0 0 200 112" class="w-full">
              <!-- zone bands -->
              <path d="M20,100 A80,80 0 0 1 100,20" fill="none" stroke="#F6B8B2" stroke-width="14" stroke-linecap="round"/>
              <path d="M100,20 A80,80 0 0 1 164.7,52.98" fill="none" stroke="#FBD9A6" stroke-width="14" stroke-linecap="round"/>
              <path d="M164.7,52.98 A80,80 0 0 1 180,100" fill="none" stroke="#A6E9D2" stroke-width="14" stroke-linecap="round"/>
              <!-- tick marks -->
              <line x1="20" y1="100" x2="12" y2="100" class="tick"/>
              <line x1="100" y1="20" x2="100" y2="12" class="tick"/>
              <line x1="164.7" y1="52.98" x2="170.9" y2="42.1" class="tick"/>
              <line x1="180" y1="100" x2="188" y2="100" class="tick"/>
              <!-- needle -->
              <g>
                <line x1="100" y1="100" x2="145.97" y2="40.73" stroke="#B54708" stroke-width="2.5" stroke-linecap="round"/>
                <circle cx="100" cy="100" r="5.5" fill="#101828"/>
              </g>
            </svg>
            <div class="absolute inset-x-0 bottom-0 text-center">
              <p class="font-mono text-4xl sm:text-5xl font-semibold text-riskamber num-tab leading-none">71<span class="text-2xl align-top">%</span></p>
            </div>
          </div>
          <div class="mt-3 flex justify-center">
            <span class="inline-flex items-center gap-1.5 rounded-full border border-riskamber-border bg-riskamber-bg px-3 py-1 text-xs font-semibold text-riskamber">
              <span class="h-1.5 w-1.5 rounded-full bg-riskamber"></span> Moderate Risk
            </span>
          </div>
        </div>
      </section>

      <!-- Factor breakdown (abbreviated for space, keeping your exact structure) -->
      <section class="lg:col-span-8">
        <div class="bg-white rounded-lg hairline h-full p-6 flex items-center justify-center text-slate-500">
           <p>Detailed AI factors will update here after analysis.</p>
        </div>
      </section>
    </div>

  </main>

  <!-- NEW: Mock AI Logic -->
  <script>
    async function runMockAI() {
      const input = document.getElementById('companyName').value;
      if (!input) return alert("Please enter a company name!");

      // 1. Change button state to simulate loading
      const btn = document.getElementById('analyzeBtn');
      const originalText = btn.innerText;
      btn.innerText = "Analyzing data...";
      btn.classList.add("opacity-70");

      // 2. Wait 1.5 seconds to simulate AI API delay
      await new Promise(resolve => setTimeout(resolve, 1500));

      // 3. Update the UI with the new company name
      document.getElementById('clientNameDisplay').innerText = input;

      // 4. Generate fake risk math
      const riskScore = Math.floor(Math.random() * 100) + 1;
      let categoryColor = riskScore < 50 ? "Red (High Risk)" : (riskScore <= 80 ? "Amber (Medium Risk)" : "Green (Low Risk)");

      // 5. Restore button and show results
      btn.innerText = originalText;
      btn.classList.remove("opacity-70");
      
      alert(`✅ AI Analysis Complete for ${input}!\n\nSimulated Risk Score: ${riskScore}%\nCategory: ${categoryColor}`);
    }
  </script>
</body>
</html>
