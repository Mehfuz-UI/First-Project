<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Client Risk Score Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#101828',
          slate: { 50: '#F7F8FA', 100: '#F0F1F3', 200: '#E4E7EC', 400: '#98A2B3', 500: '#667085', 700: '#344054' },
          cobalt: '#2450C4',
          riskgreen: { DEFAULT: '#12805C', bg: '#ECFDF5', border: '#A6E9D2' },
          riskamber: { DEFAULT: '#B54708', bg: '#FFFAEB', border: '#FBD9A6' },
          riskred: { DEFAULT: '#B42318', bg: '#FEF3F2', border: '#F6B8B2' },
        },
        fontFamily: { serif: ['"Source Serif 4"', 'serif'], sans: ['Inter', 'sans-serif'], mono: ['"IBM Plex Mono"', 'monospace'] },
      }
    }
  }
</script>
<style>
  body { background-color: #F7F8FA; }
  .tick { stroke: #CBD2DD; stroke-width: 1.5; }
  .hairline { box-shadow: inset 0 0 0 1px #E4E7EC; }
  /* Smooth animation for the needle */
  #gaugeNeedle { transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1); transform-origin: 100px 100px; }
</style>
</head>
<body class="min-h-screen text-ink font-sans antialiased">

  <header class="bg-ink text-white">
    <div class="max-w-6xl mx-auto px-5 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="h-8 w-8 border border-white/25 flex items-center justify-center font-serif text-sm">RA</div>
        <div>
          <p class="text-sm font-semibold tracking-wide">Risk Assessment Ledger</p>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-5 py-8">

    <!-- Dynamic Search Bar -->
    <div class="mb-8 bg-white p-4 rounded-lg hairline flex gap-4 items-center">
      <input type="text" id="companyName" placeholder="Enter company name to analyze..." class="border border-slate-200 p-3 rounded-md w-full font-sans text-sm outline-none focus:border-cobalt">
      <button id="analyzeBtn" onclick="runMockAI()" class="bg-cobalt hover:bg-blue-800 text-white px-6 py-3 rounded-md text-sm font-semibold whitespace-nowrap transition-colors">
        Run AI Analysis
      </button>
    </div>

    <!-- Client Header -->
    <div class="mb-6 pb-6 border-b border-slate-200">
      <h1 id="clientNameDisplay" class="font-serif text-3xl font-semibold text-ink">Awaiting Input...</h1>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- Score / Gauge card -->
      <section class="lg:col-span-4">
        <div class="bg-white rounded-lg hairline p-6 h-full flex flex-col items-center">
          <p class="text-[11px] uppercase tracking-[0.14em] text-slate-500 font-semibold mb-4 self-start">Composite Risk Score</p>

          <div class="relative w-full max-w-[260px]">
            <svg viewBox="0 0 200 112" class="w-full">
              <!-- Zone bands -->
              <path d="M20,100 A80,80 0 0 1 100,20" fill="none" stroke="#F6B8B2" stroke-width="14" stroke-linecap="round"/>
              <path d="M100,20 A80,80 0 0 1 164.7,52.98" fill="none" stroke="#FBD9A6" stroke-width="14" stroke-linecap="round"/>
              <path d="M164.7,52.98 A80,80 0 0 1 180,100" fill="none" stroke="#A6E9D2" stroke-width="14" stroke-linecap="round"/>
              <!-- Needle Group: Starts pointing at 0% (left) -->
              <g id="gaugeNeedle" style="transform: rotate(0deg);">
                <line x1="100" y1="100" x2="25" y2="100" stroke="#101828" stroke-width="3" stroke-linecap="round"/>
                <circle cx="100" cy="100" r="6" fill="#101828"/>
              </g>
            </svg>
            <div class="absolute inset-x-0 bottom-0 text-center">
              <!-- Score Number -->
              <p id="scoreNumber" class="font-mono text-5xl font-semibold text-slate-400 leading-none">--<span class="text-2xl align-top">%</span></p>
            </div>
          </div>
          <div class="mt-4">
             <!-- Status Badge -->
             <span id="scoreBadge" class="inline-flex items-center gap-1.5 rounded-full border border-slate-200 bg-slate-50 px-3 py-1 text-xs font-semibold text-slate-500">
               Pending Analysis
             </span>
          </div>
        </div>
      </section>

      <!-- Dynamic Detailed Factors -->
      <section class="lg:col-span-8">
        <div class="bg-white rounded-lg hairline h-full p-6">
          <p class="text-[11px] uppercase tracking-[0.14em] text-slate-500 font-semibold mb-4">AI-Derived Financial Factors</p>
          <!-- This container gets filled by JavaScript -->
          <div id="detailedFactors" class="text-sm text-slate-500 flex items-center h-4/5">
             <p>Awaiting company name to generate financial report and risk factors...</p>
          </div>
        </div>
      </section>

    </div>
  </main>

  <script>
    async function runMockAI() {
      const input = document.getElementById('companyName').value;
      if (!input) return alert("Please enter a company name!");

      // 1. Loading State
      const btn = document.getElementById('analyzeBtn');
      btn.innerText = "Analyzing data...";
      btn.classList.add("opacity-70");
      document.getElementById('detailedFactors').innerHTML = `<p class="animate-pulse text-cobalt font-semibold">Fetching web and financial data for ${input}...</p>`;

      await new Promise(resolve => setTimeout(resolve, 1500));

      // 2. Data Generation
      document.getElementById('clientNameDisplay').innerText = input;
      const riskScore = Math.floor(Math.random() * 100) + 1;
      
      // Calculate realistic random financials
      const revenue = (Math.random() * 50 + 2).toFixed(1);
      const funding = (Math.random() * 20).toFixed(1);
      const runway = Math.floor(Math.random() * 24 + 3);

      // 3. UI Updates: Gauge Needle (180 degrees total arc)
      const degrees = (riskScore / 100) * 180;
      document.getElementById('gaugeNeedle').style.transform = `rotate(${degrees}deg)`;

      // 4. UI Updates: Colors and Text
      const scoreEl = document.getElementById('scoreNumber');
      const badgeEl = document.getElementById('scoreBadge');
      
      // Reset color classes
      scoreEl.className = "font-mono text-5xl font-semibold leading-none ";
      badgeEl.className = "inline-flex items-center gap-1.5 rounded-full border px-3 py-1 text-xs font-semibold ";

      if (riskScore < 50) { // RED
        scoreEl.className += "text-riskred";
        badgeEl.className += "border-riskred-border bg-riskred-bg text-riskred";
        badgeEl.innerHTML = `<span class="h-1.5 w-1.5 rounded-full bg-riskred"></span> High Risk`;
      } else if (riskScore <= 80) { // AMBER
        scoreEl.className += "text-riskamber";
        badgeEl.className += "border-riskamber-border bg-riskamber-bg text-riskamber";
        badgeEl.innerHTML = `<span class="h-1.5 w-1.5 rounded-full bg-riskamber"></span> Moderate Risk`;
      } else { // GREEN
        scoreEl.className += "text-riskgreen";
        badgeEl.className += "border-riskgreen-border bg-riskgreen-bg text-riskgreen";
        badgeEl.innerHTML = `<span class="h-1.5 w-1.5 rounded-full bg-riskgreen"></span> Low Risk`;
      }
      
      scoreEl.innerHTML = `${riskScore}<span class="text-2xl align-top">%</span>`;

      // 5. Build Dynamic Financial Report
      document.getElementById('detailedFactors').innerHTML = `
        <div class="w-full space-y-4">
          <div class="grid grid-cols-3 gap-4 border-b border-slate-100 pb-4">
            <div><p class="text-xs text-slate-400">Est. Annual Revenue</p><p class="font-mono text-lg text-ink font-semibold">$${revenue}M</p></div>
            <div><p class="text-xs text-slate-400">Recent Funding</p><p class="font-mono text-lg text-ink font-semibold">$${funding}M</p></div>
            <div><p class="text-xs text-slate-400">Est. Cash Runway</p><p class="font-mono text-lg text-ink font-semibold">${runway} months</p></div>
          </div>
          <div>
             <p class="text-sm text-ink font-semibold mb-1">AI Analytical Summary</p>
             <p class="text-sm leading-relaxed">Based on synthetic analysis, <strong>${input}</strong> exhibits a risk score of ${riskScore}%. Financial indicators suggest a ${riskScore > 50 ? 'stable' : 'volatile'} revenue cycle combined with ${runway > 12 ? 'strong' : 'concerning'} capital reserves. Historical payment history data correlates with this assessment.</p>
          </div>
        </div>
      `;

      btn.innerText = "Run AI Analysis";
      btn.classList.remove("opacity-70");
    }
  </script>
</body>
</html>
